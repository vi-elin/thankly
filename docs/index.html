<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanklio — A Simple Gratitude Journal</title>
    <meta name="description" content="Thanklio is a simple gratitude journal for your everyday moments. Capture what you're thankful for in seconds and build a lasting habit.">

    <link rel="icon" type="image/png" href="images/favicon-32.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

    <meta property="og:title" content="Thanklio — A Simple Gratitude Journal">
    <meta property="og:description" content="A simple gratitude journal for your everyday moments.">
    <meta property="og:image" content="https://thanklio.app/images/app-icon-512.png">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://thanklio.app/">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

    <style>
        /* HERO */
        .hero {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 64px 24px;
            text-align: center;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            z-index: -1;
            border-radius: 50%;
            filter: blur(80px);
            animation: drift 16s ease-in-out infinite;
        }

        .blob-1 {
            top: 8%;
            left: 8%;
            width: 320px;
            height: 320px;
            background: #F6B8CC;
            opacity: 0.4;
        }

        .blob-2 {
            top: 30%;
            right: 6%;
            width: 280px;
            height: 280px;
            background: #B9C9F2;
            opacity: 0.35;
            animation-delay: -5s;
            animation-duration: 19s;
        }

        .blob-3 {
            bottom: 6%;
            left: 32%;
            width: 260px;
            height: 260px;
            background: #D9BCEF;
            opacity: 0.32;
            animation-delay: -10s;
            animation-duration: 21s;
        }

        @keyframes drift {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -26px) scale(1.08);
            }

            66% {
                transform: translate(-24px, 22px) scale(0.96);
            }
        }

        @keyframes revealUp {
            from {
                opacity: 0;
                transform: translateY(26px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes iconIn {
            from {
                opacity: 0;
                transform: scale(0.55) rotate(-18deg);
            }

            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .intro {
            opacity: 0;
            animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .app-icon {
            width: 88px;
            height: 88px;
            border-radius: 22px;
            box-shadow: 0 20px 40px -16px rgba(217, 120, 150, 0.45);
            margin-bottom: 32px;
            object-fit: cover;
            opacity: 0;
            animation: iconIn 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s forwards;
        }

        .hero h1 {
            font-size: clamp(44px, 8vw, 80px);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.02;
            margin: 0 0 20px;
            animation-delay: 0.28s;
        }

        .hero p.tagline {
            font-size: clamp(18px, 2.4vw, 23px);
            font-weight: 400;
            color: var(--ink-soft);
            max-width: 520px;
            margin: 0 0 40px;
            animation-delay: 0.42s;
        }

        .hero .cta-btn {
            animation-delay: 0.56s;
        }

        @media (prefers-reduced-motion: reduce) {

            .blob,
            .app-icon,
            .intro {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
        }
    </style>
</head>

<body>

    <section class="hero">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>

        <img class="app-icon" src="images/app-icon.png" alt="Thanklio app icon">

        <h1 class="intro">Thanklio</h1>
        <p class="tagline intro">A simple gratitude journal for your everyday moments</p>

        <a href="https://apps.apple.com/app/id6791693586" class="cta-btn intro" target="_blank" rel="noopener">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M9 2v10M9 12l-4-4M9 12l4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M3 15h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
            Download on the App Store
        </a>
    </section>

    <footer>
        <div class="footer-inner">
            <div class="footer-links">
                <a href="privacy-policy.html">Privacy Policy</a>
                <a href="terms-of-service.html">Terms of Service</a>
                <a href="support.html">Support</a>
                <a href="mailto:vielindevelopment@gmail.com">vielindevelopment@gmail.com</a>
            </div>
            <div class="copyright">© 2026 Thanklio</div>
        </div>
    </footer>

</body>

</html>
