<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - Thanklio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(180deg, #f6dce6 0%, #fbeef1 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: transparent;
            padding: 40px;
        }

        h1 {
            color: #000000;
            margin-bottom: 10px;
            font-size: 2.5em;
            font-weight: 600;
        }

        .last-updated {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 30px;
            font-style: italic;
        }

        h2 {
            color: #000000;
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 1.5em;
            font-weight: 600;
        }

        p {
            margin-bottom: 15px;
            text-align: justify;
        }

        .contact {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
            border-left: 4px solid #c9668c;
        }

        a {
            color: #c9668c;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Support</h1>

        <p>Need help with Thanklio? We're happy to assist you with any questions, issues, or feedback about the app.</p>

        <div class="contact">
            <h2>Contact Us</h2>
            <p>For all questions, please reach out to us at:</p>
            <p><strong>Email:</strong> <a href="mailto:vielindevelopment@gmail.com">vielindevelopment@gmail.com</a></p>
            <p>We will respond to your inquiry within 48 hours.</p>
        </div>
    </div>
</body>

</html>
